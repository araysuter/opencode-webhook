name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node test/webhook-notify.test.mjs

  bun:
    name: Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun test/webhook-notify.test.mjs

  opencode-smoke:
    name: OpenCode ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - opencode-ai@1.19.6
          - opencode-ai@latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install OpenCode CLI
        run: npm install --global ${{ matrix.package }}
      - name: Show version
        run: opencode --version
      - name: Load plugin with real CLI
        run: node test/opencode-load-smoke.mjs
        env:
          OPENCODE_SMOKE_TIMEOUT_MS: "60000"
